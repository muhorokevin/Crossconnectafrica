      @keyframes cca-settle { from { transform: scale(1.06) } to { transform: scale(1) } }

      @keyframes cca-fade-in-up { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: none } }
      @keyframes cca-slow-zoom { from { transform: scale(1) } to { transform: scale(1.08) } }
      .animate-fade-in { animation: cca-fade-in 0.25s ease-out both; }
      .animate-fade-in-up { animation: cca-fade-in-up 0.3s ease-out both; }
      .animate-slow-zoom { animation: cca-slow-zoom 20s ease-out both; }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }

        .fill-word { color: #f6f2ea; }
